<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Playlist</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🎵 My Playlist</h1>
    <p class="subtitle">My Favorite Songs</p>

    <video class="banner" autoplay muted loop playsinline controls>
        <source src="front.mp4" type="video/mp4">
    </video>

    <!-- SONG 1 -->
    <div class="card">

        <img src="kanibalismo.jpg" class="cover" alt="Kanibalismo">

        <h2>Pag-Ibig ay Kanibalismo II</h2>
        <p>Artist: fitterkarma</p>

        <audio controls>
            <source src="kanibalismo.mp3" type="audio/mpeg">
        </audio>

    </div>

    <!-- SONG 2 -->
    <div class="card">

        <img src="kalapastangan.png" class="cover" alt="Kalapastangan">

        <h2>Kalapastangan</h2>
        <p>Artist: fitterkarma</p>

        <audio controls>
            <source src="kalapastangan.mp3" type="audio/mpeg">
        </audio>

    </div>

    <!-- SONG 3 -->
    <div class="card">

        <img src="Aura.jpg" class="cover" alt="Aura">

        <h2>Aura</h2>
        <p>Artist: IV OF SPADES</p>

        <audio controls>
            <source src="Aura.mp3" type="audio/mpeg">
        </audio>

    </div>

</div>

</body>
</html>
